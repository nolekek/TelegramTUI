[package]
name = "tg-tui"
version = "1.0.1"
edition = "2021"
authors = ["TgTui Contributors"]
description = "High-performance Telegram Terminal Client (TUI) rebuild"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1.40", features = ["full"] }
unicode-width = "0.1"
unicode-segmentation = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4"
