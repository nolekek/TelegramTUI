name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tg-tui-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tg-tui-windows-x64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tg-tui-macos-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fetch TDLib Binaries
        run: cargo run -p fetch-tdlib

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p tg-tui

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist/tg-tui-linux-x86_64
          cp target/${{ matrix.target }}/release/tg-tui dist/tg-tui-linux-x86_64/
          cp .data/libtdjson.so dist/tg-tui-linux-x86_64/
          chmod +x dist/tg-tui-linux-x86_64/tg-tui
          cat << 'EOF' > dist/tg-tui-linux-x86_64/run.sh
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" >/dev/null 2>&1 && pwd )"
          cd "$DIR"
          chmod +x ./tg-tui
          export LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"
          exec ./tg-tui "$@"
          EOF
          chmod +x dist/tg-tui-linux-x86_64/run.sh
          cd dist && tar -czf ../${{ matrix.artifact_name }} tg-tui-linux-x86_64

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\tg-tui-windows-x64 | Out-Null
          Copy-Item target\${{ matrix.target }}\release\tg-tui.exe dist\tg-tui-windows-x64\
          Copy-Item .data\tdjson.dll dist\tg-tui-windows-x64\
          if (Test-Path .data\libcrypto-3-x64.dll) { Copy-Item .data\libcrypto-3-x64.dll dist\tg-tui-windows-x64\ }
          if (Test-Path .data\libssl-3-x64.dll) { Copy-Item .data\libssl-3-x64.dll dist\tg-tui-windows-x64\ }
          if (Test-Path .data\z.dll) { Copy-Item .data\z.dll dist\tg-tui-windows-x64\ }
          Compress-Archive -Path dist\tg-tui-windows-x64\* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist/tg-tui-macos-x64
          cp target/${{ matrix.target }}/release/tg-tui dist/tg-tui-macos-x64/
          if [ -f .data/libtdjson.dylib ]; then cp .data/libtdjson.dylib dist/tg-tui-macos-x64/; fi
          chmod +x dist/tg-tui-macos-x64/tg-tui
          cd dist && tar -czf ../${{ matrix.artifact_name }} tg-tui-macos-x64

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
